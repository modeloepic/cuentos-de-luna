<!DOCTYPE html>
<html lang="es">
<head>

<title>Sebas aprende los colores — Escucha el cuento · Cuentos de Luna</title>
<meta name="description" content="Escucha la narración completa de «Sebas aprende los colores», un cuento bilingüe de dinosaurios para niños de 3 a 6 años. Cuentos de Luna.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
    background: #FFFBF2;
    color: #5A3A1A;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .card {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }
  .brand {
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #B98A2F;
    font-weight: bold;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 34px;
    line-height: 1.15;
    margin-bottom: 6px;
  }
  h2 {
    font-size: 20px;
    font-weight: normal;
    color: #8A6D3B;
    margin-bottom: 20px;
  }
  img.cover {
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(90, 58, 26, 0.28);

  }
  .player-box {
    background: #FFFFFF;
    border: 3px solid #F0DFC0;
    border-radius: 22px;
    padding: 22px 18px;
    box-shadow: 0 6px 18px rgba(90, 58, 26, 0.12);
  }

    margin-bottom: 14px;
  }
  audio {

    height: 54px;
  }

    margin-top: 12px;
    font-size: 15px;
    color: #8A6D3B;
  }
  .lang {

    margin-top: 26px;
    background: #E8720C;
    color: #FFFFFF;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    padding: 14px 26px;
    border-radius: 999px;

    <div class="player-box">

      Sebas aprende los colores · Pedro Mariño<br>
      Historias bilingües para pequeños exploradores
